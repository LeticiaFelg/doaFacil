<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoaFácil – Histórico</title>
  <link rel="stylesheet" href="../assets/css/historico.css">
  <link rel="stylesheet" href="../assets/css/components/navbar.css">
  <link rel="stylesheet" href="../assets/css/components/footer.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- TOP NAV -->
  <div id="navbar"></div>

  <div class="page-container">

    <!-- USER CONTEXT -->
    <div class="user-context-bar">
      <div class="ctx-avatar">👩‍💼</div>
      <div class="ctx-info">
        <div class="ctx-name">Maria Clara Souza</div>
        <div class="ctx-sub">Histórico pessoal de doações e recebimentos</div>
      </div>
      <div class="ctx-badge"><i class="bi bi-star-fill"></i> Doadora Recorrente</div>
    </div>

    <!-- SUMMARY METRICS -->
    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-icon green">📦</div>
        <div>
          <div class="metric-num">23</div>
          <div class="metric-lbl">Itens doados</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon yellow">🏠</div>
        <div>
          <div class="metric-num">7</div>
          <div class="metric-lbl">Itens recebidos</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon blue">✅</div>
        <div>
          <div class="metric-num">19</div>
          <div class="metric-lbl">Concluídos</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon orange">⏳</div>
        <div>
          <div class="metric-num">4</div>
          <div class="metric-lbl">Em andamento</div>
        </div>
      </div>
    </div>

    <!-- TABS + FILTERS -->
    <div class="tab-area">
      <div class="history-tabs">
        <button class="h-tab active" onclick="switchTab('doado', this)">
          <i class="bi bi-box-arrow-up"></i> Doações feitas <span class="tab-count">23</span>
        </button>
        <button class="h-tab" onclick="switchTab('recebido', this)">
          <i class="bi bi-box-arrow-down"></i> Itens recebidos <span class="tab-count">7</span>
        </button>
      </div>
      <div class="filter-row">
        <div class="search-sm">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Buscar item..." oninput="filterHistory(this.value)"/>
        </div>
        <select class="filter-select" onchange="filterByStatus(this.value)">
          <option value="all">Todos os status</option>
          <option value="concluido">Concluído</option>
          <option value="reservado">Reservado</option>
          <option value="disponivel">Disponível</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <select class="filter-select">
          <option>Mais recentes</option>
          <option>Mais antigos</option>
          <option>A–Z</option>
        </select>
      </div>
    </div>

    <!-- TABLE VIEW: DOADO -->
    <div class="content-card" id="tab-doado">
      <div class="table-header cols-doado">
        <span>Item</span>
        <span>Receptor</span>
        <span>Categoria</span>
        <span>Data</span>
        <span>Status</span>
        <span></span>
      </div>
      <div id="doado-rows"></div>
    </div>

    <!-- TABLE VIEW: RECEBIDO -->
    <div class="content-card" id="tab-recebido" style="display:none;">
      <div class="table-header cols-recebido">
        <span>Item</span>
        <span>Doador</span>
        <span>Categoria</span>
        <span>Data</span>
        <span>Status</span>
      </div>
      <div id="recebido-rows"></div>
    </div>

  </div>
  <div id="footer"></div>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/components/navbar.js"></script>
  <script src="../assets/js/modal.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script>
    // ── MOCK DATA ───────────────────────────────────────────────
    const currentUser = 'Maria Clara Souza';
    const mockDoado = [
      { id:1,  emoji:'🛋️', name:'Sofá de 3 lugares',        cat:'Móveis',      receptor:'Carlos M.',   date:'19/05/2026', status:'disponivel', doador: 'Maria Clara Souza' },
      { id:3,  emoji:'📱', name:'Micro-ondas 30L',          cat:'Eletro',      receptor:'Ana Lima',    date:'12/05/2026', status:'reservado',  doador: 'Maria Clara Souza' },
      { id:4,  emoji:'👕', name:'Kit roupas infantis',      cat:'Roupas',      receptor:'ONG Recomeço',date:'08/05/2026', status:'concluido',  doador: 'Maria Clara Souza' },
      { id:5,  emoji:'🪑', name:'Mesa escritório',          cat:'Móveis',      receptor:'João Alves',  date:'02/05/2026', status:'concluido',  doador: 'Maria Clara Souza' },
      { id:6,  emoji:'📚', name:'Livros didáticos (4 vol)', cat:'Escolar',     receptor:'Projeto ABC', date:'28/04/2026', status:'concluido',  doador: 'Maria Clara Souza' },
    ];

    // Show only entries donated by the logged-in user
    const myDonations = mockDoado.filter(d => d.doador === currentUser);

    const mockRecebido = [
      { id:1, emoji:'🪑', name:'Mesa escritório',        cat:'Móveis',     doador:'Lara C.',    date:'25/04/2026', status:'concluido' },
      { id:2, emoji:'📚', name:'Livros didáticos',       cat:'Escolar',    doador:'Roberto S.', date:'18/04/2026', status:'concluido' },
      { id:3, emoji:'👗', name:'Roupas tamanho M (lote)',cat:'Roupas',     doador:'Ana P.',     date:'10/04/2026', status:'concluido' },
      { id:4, emoji:'🍳', name:'Frigideira antiaderente',cat:'Utensílios', doador:'Carlos M.',  date:'01/04/2026', status:'concluido' },
      { id:5, emoji:'🎒', name:'Mochila infantil',       cat:'Escolar',    doador:'Vera N.',    date:'22/03/2026', status:'concluido' },
      { id:6, emoji:'🧸', name:'Kit brinquedos',         cat:'Brinquedos', doador:'Inst.Vida',  date:'15/03/2026', status:'concluido' },
      { id:7, emoji:'🛋️', name:'Poltrona de leitura',   cat:'Móveis',     doador:'Hugo B.',    date:'05/03/2026', status:'reservado' },
    ];

    const statusMap = {
      concluido:  '<span class="pill pill-concluido">✅ Concluído</span>',
      reservado:  '<span class="pill pill-reservado">⏳ Reservado</span>',
      disponivel: '<span class="pill pill-disponivel">🔵 Disponível</span>',
      cancelado:  '<span class="pill pill-cancelado">✗ Cancelado</span>',
    };

    function getItemImage(id) {
      return '../assets/img/items/item' + id + '.jpg';
    }

    function renderDoado(data) {
      const container = document.getElementById('doado-rows');
      if (!data.length) {
        container.innerHTML = '<div class="empty-state"><div class="e-icon">📭</div><p>Nenhum item encontrado.</p></div>';
        return;
      }
      container.innerHTML = data.map(item => `
        <div class="history-row cols-doado ${item.status === 'concluido' ? 'recurrent-row' : ''}">
          <div class="item-cell">
            <div class="item-emoji-thumb"><img src="${getItemImage(item.id)}" alt="${item.name}" loading="lazy"></div>
            <div>
              <div class="item-cell-name">${item.name}</div>
              <div class="item-cell-cat">${item.cat}</div>
            </div>
          </div>
          <div style="font-size:.88rem;font-weight:500;">${item.receptor}</div>
          <div style="font-size:.83rem;color:var(--text-muted);">${item.cat}</div>
          <div class="row-date">${item.date}</div>
          <div>${statusMap[item.status]}</div>
          <div><button class="btn-mini" onclick="alert('Detalhes: ${item.name}')"><i class="bi bi-eye"></i></button></div>
        </div>
      `).join('');
    }

    function renderRecebido(data) {
      const container = document.getElementById('recebido-rows');
      if (!data.length) {
        container.innerHTML = '<div class="empty-state"><div class="e-icon">📭</div><p>Nenhum item encontrado.</p></div>';
        return;
      }
      container.innerHTML = data.map(item => `
        <div class="history-row cols-recebido">
          <div class="item-cell">
            <div class="item-emoji-thumb"><img src="${getItemImage(item.id)}" alt="${item.name}" loading="lazy"></div>
            <div>
              <div class="item-cell-name">${item.name}</div>
              <div class="item-cell-cat">${item.cat}</div>
            </div>
          </div>
          <div style="font-size:.88rem;font-weight:500;">${item.doador}</div>
          <div style="font-size:.83rem;color:var(--text-muted);">${item.cat}</div>
          <div class="row-date">${item.date}</div>
          <div>${statusMap[item.status]}</div>
        </div>
      `).join('');
    }

    // Initial render (only show current user's donations)
    renderDoado(myDonations);
    renderRecebido(mockRecebido);

    let currentTab = 'doado';

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.h-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-doado').style.display    = tab === 'doado'    ? 'block' : 'none';
      document.getElementById('tab-recebido').style.display = tab === 'recebido' ? 'block' : 'none';
    }

    function filterHistory(val) {
      const q = val.toLowerCase();
      if (currentTab === 'doado') {
        renderDoado(mockDoado.filter(i => i.name.toLowerCase().includes(q) || i.receptor.toLowerCase().includes(q)));
      } else {
        renderRecebido(mockRecebido.filter(i => i.name.toLowerCase().includes(q) || i.doador.toLowerCase().includes(q)));
      }
    }

    function filterByStatus(val) {
      if (currentTab === 'doado') {
        renderDoado(val === 'all' ? mockDoado : mockDoado.filter(i => i.status === val));
      } else {
        renderRecebido(val === 'all' ? mockRecebido : mockRecebido.filter(i => i.status === val));
      }
    }
  </script>
</body>
</html>
