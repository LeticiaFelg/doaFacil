<div id="doarModal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Cadastrar Item para Doação</h2>
      <button type="button" class="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-description">
      <p>📦 Compartilhe itens que você não usa mais com quem precisa. Descreva bem o produto para ajudar outros usuários a encontrá-lo.</p>
    </div>
    <form id="formDoacao" class="modal-form">
      <div class="form-group">
        <label for="itemNome">Nome do Item *</label>
        <input type="text" id="itemNome" name="nome" required>
      </div>
      <div class="form-group">
        <label for="itemCategoria">Categoria *</label>
        <select id="itemCategoria" name="categoria" required>
          <option value="">Selecione uma categoria</option>
          <option value="moveis">Móveis</option>
          <option value="eletro">Eletro</option>
          <option value="roupas">Roupas</option>
          <option value="calcados">Calçados</option>
          <option value="escolar">Escolar</option>
          <option value="utensilios">Utensílios</option>
          <option value="brinquedos">Brinquedos</option>
        </select>
      </div>
      <div class="form-group">
        <label for="itemDescricao">Descrição</label>
        <textarea id="itemDescricao" name="descricao" rows="4" placeholder="Descreva o estado, características e detalhes do item..."></textarea>
      </div>
      <div class="form-group">
        <label for="itemCondicao">Condição *</label>
        <select id="itemCondicao" name="condicao" required>
          <option value="">Selecione a condição</option>
          <option value="otimo">Ótimo</option>
          <option value="bom">Bom</option>
          <option value="usado">Usado</option>
        </select>
      </div>
      <div class="form-group">
        <label for="itemLocalizacao">Localização *</label>
        <input type="text" id="itemLocalizacao" name="localizacao" placeholder="Bairro e Cidade" required>
      </div>
      <button type="submit" class="btn-submit">Cadastrar Item</button>
    </form>
  </div>
</div>
